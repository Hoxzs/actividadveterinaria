<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de medicina</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <form [formGroup]="formProducto" (ngSubmit)="agregar()">
        <div class="container mt-5">
          <div class="row justify-content-center">
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title text-center">Registro de equipos</h3>
                </div>
                <div class="card-body">
                  <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ingrese el nombre del equipo" formControlName="nombre">
                  </div>
                  <div class="form-group">
                    <label for="descripcion">Serie</label>
                    <textarea class="form-control" id="descripcion" rows="3" placeholder="Ingrese la serie del equipo" formControlName="serie"></textarea>
                  </div>
                  <div class="form-group">
                    <label for="precio">Empleado asignado</label>
                    <input type="text" class="form-control" id="precio" placeholder="Ingrese el empleado asignado del equipo" formControlName="empleado">
                  </div>
                  <div class="form-group mt-3 d-flex justify-content-start">
                    <button type="submit" class="btn btn-primary me-2" [disabled]="formProducto.invalid">Guardar</button>
                    <button type="submit" class="btn btn-primary me-2" routerLink="/menu">Regresar</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>      
</body>
</html>
